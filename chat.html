<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>ChatConnect - Chat</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef2f7;
}

.header {

    height: 65px;

    background: #2563eb;

    color: white;

    display: flex;

    align-items: center;

    padding: 10px 15px;

}

.back {

    border: none;

    background: transparent;

    color: white;

    font-size: 25px;

    margin-right: 10px;

    cursor: pointer;

}

.avatar {

    width: 42px;

    height: 42px;

    border-radius: 50%;

    background: white;

    color: #2563eb;

    display: flex;

    align-items: center;

    justify-content: center;

    font-weight: bold;

    margin-right: 10px;

}

.header-info {

    flex: 1;

}

.header-name {

    font-size: 17px;

    font-weight: bold;

}

.header-username {

    font-size: 12px;

    opacity: .85;

}

.messages {

    height: calc(100vh - 125px);

    overflow-y: auto;

    padding: 15px;

}

.message-row {

    display: flex;

    margin-bottom: 10px;

}

.message-row.mine {

    justify-content: flex-end;

}

.bubble {

    max-width: 75%;

    padding: 10px 13px;

    border-radius: 14px;

    background: white;

    box-shadow: 0 2px 5px rgba(0,0,0,.08);

}

.mine .bubble {

    background: #2563eb;

    color: white;

}

.time {

    font-size: 10px;

    margin-top: 4px;

    opacity: .65;

}

.input-area {

    position: fixed;

    bottom: 0;

    left: 0;

    right: 0;

    height: 60px;

    background: white;

    border-top: 1px solid #ddd;

    display: flex;

    padding: 8px;

    gap: 8px;

}

.input-area input {

    flex: 1;

    border: 1px solid #cbd5e1;

    border-radius: 22px;

    padding: 0 15px;

    font-size: 16px;

    outline: none;

}

.send {

    width: 48px;

    border: none;

    border-radius: 50%;

    background: #2563eb;

    color: white;

    font-size: 18px;

}

.status {

    text-align: center;

    padding: 20px;

    color: #64748b;

}

</style>

</head>


<body>


<div class="header">

    <button class="back" id="backBtn">
        ‹
    </button>

    <div class="avatar" id="avatar">
        U
    </div>

    <div class="header-info">

        <div
            class="header-name"
            id="chatName"
        >
            Loading...
        </div>

        <div
            class="header-username"
            id="chatUsername"
        >
            Loading...
        </div>

    </div>

</div>


<div
    class="messages"
    id="messages"
>

    <div class="status">
        Loading messages...
    </div>

</div>


<div class="input-area">

    <input
        type="text"
        id="messageInput"
        placeholder="Type a message..."
        autocomplete="off"
    >

    <button
        class="send"
        id="sendBtn"
    >
        ➤
    </button>

</div>


<script type="module">


import {

    initializeApp

} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {

    getAuth,

    onAuthStateChanged

} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    collection,
    addDoc,
    query,
    orderBy,
    onSnapshot,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyDTGE8Lq2gLLmODwxrbtaqR49D0xxsU_OM",

    authDomain:
        "chatconnect-26efa.firebaseapp.com",

    projectId:
        "chatconnect-26efa",

    storageBucket:
        "chatconnect-26efa.firebasestorage.app",

    messagingSenderId:
        "1051940912750",

    appId:
        "1:1051940912750:web:4363352013d1fdcf62707f"

};


const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


const db =
    getFirestore(app);


let currentUser = null;

let otherUser = null;

let chatId = null;


const params =
    new URLSearchParams(
        window.location.search
    );


const otherUid =
    params.get("uid");


const messages =
    document.getElementById("messages");


const messageInput =
    document.getElementById("messageInput");


const sendBtn =
    document.getElementById("sendBtn");


function createChatId(uid1, uid2) {

    return [uid1, uid2]
        .sort()
        .join("_");

}


onAuthStateChanged(
    auth,
    async (user) => {

        if (!user) {

            window.location.href =
                "index.html";

            return;

        }


        if (!otherUid) {

            alert("User not selected.");

            window.location.href =
                "home.html";

            return;

        }


        currentUser = user;


        chatId =
            createChatId(
                currentUser.uid,
                otherUid
            );


        await loadOtherUser();

// Create/update private chat information
await setDoc(
    doc(db, "chats", chatId),
    {
        participants: [
            currentUser.uid,
            otherUid
        ],
        updatedAt: serverTimestamp()
    },
    {
        merge: true
    }
);

        listenForMessages();

    }
);


async function loadOtherUser() {

    const userRef =
        doc(
            db,
            "users",
            otherUid
        );


    const snapshot =
        await getDoc(userRef);


    if (!snapshot.exists()) {

        alert("User not found.");

        window.location.href =
            "home.html";

        return;

    }


    otherUser =
        snapshot.data();


    document.getElementById(
        "chatName"
    ).textContent =
        otherUser.displayName ||
        "User";


    document.getElementById(
        "chatUsername"
    ).textContent =
        "@" +
        (otherUser.username || "");


    document.getElementById(
        "avatar"
    ).textContent =
        (
            otherUser.displayName ||
            "U"
        )
        .charAt(0)
        .toUpperCase();

}


function listenForMessages() {

    const messagesRef =
        collection(
            db,
            "chats",
            chatId,
            "messages"
        );


    const messagesQuery =
        query(
            messagesRef,
            orderBy("timestamp", "asc")
        );


    onSnapshot(
        messagesQuery,
        (snapshot) => {

            messages.innerHTML = "";


            if (snapshot.empty) {

                messages.innerHTML =
                    '<div class="status">' +
                    'No messages yet. Say hello! 👋' +
                    '</div>';

                return;

            }


            snapshot.forEach(
                (messageDoc) => {

                    const data =
                        messageDoc.data();


                    displayMessage(data);

                }
            );


            messages.scrollTop =
                messages.scrollHeight;

        },

        (error) => {

            console.error(error);

            messages.innerHTML =
                '<div class="status">' +
                'Unable to load messages.' +
                '</div>';

        }
    );

}


function displayMessage(data) {

    const row =
        document.createElement("div");


    const bubble =
        document.createElement("div");


    row.className =
        "message-row";


    bubble.className =
        "bubble";


    if (
        data.senderId ===
        currentUser.uid
    ) {

        row.classList.add("mine");

    }


    const text =
        document.createElement("div");


    text.textContent =
        data.text || "";


    const time =
        document.createElement("div");


    time.className =
        "time";


    if (data.timestamp) {

        const date =
            data.timestamp.toDate();


        time.textContent =
            date.toLocaleTimeString(
                [],
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );

    }


    bubble.appendChild(text);

    bubble.appendChild(time);

    row.appendChild(bubble);

    messages.appendChild(row);

}


async function sendMessage() {

    const text =
        messageInput.value.trim();


    if (!text) {

        return;

    }


    if (!currentUser || !otherUid) {

        return;

    }


    sendBtn.disabled = true;


    try {

        const messagesRef =
            collection(
                db,
                "chats",
                chatId,
                "messages"
            );


        await addDoc(
            messagesRef,
            {

                senderId:
                    currentUser.uid,

                receiverId:
                    otherUid,

                text:
                    text,

                timestamp:
                    serverTimestamp()

            }
        );


        messageInput.value = "";


    } catch (error) {

        console.error(error);

        alert(
            "Message failed: " +
            error.message
        );

    }


    sendBtn.disabled = false;

}


sendBtn.onclick =
    sendMessage;


messageInput.addEventListener(
    "keydown",
    (event) => {

        if (
            event.key === "Enter"
        ) {

            sendMessage();

        }

    }
);


document.getElementById(
    "backBtn"
).onclick = function () {

    window.location.href =
        "home.html";

};


</script>

</body>

</html>
